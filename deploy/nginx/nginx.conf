worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 4096;
}

http {
    # Docker's embedded DNS: "api" resolves to every replica, re-resolved as replicas come and go.
    resolver 127.0.0.11 valid=5s ipv6=off;

    # Pass a well-formed client X-Request-ID through; otherwise use nginx's own $request_id.
    # Same rule as the app (^[A-Za-z0-9._-]{1,64}$), so nginx and app log lines share the id.
    map $http_x_request_id $req_id {
        "~^[A-Za-z0-9._-]{1,64}$" $http_x_request_id;
        default $request_id;
    }

    log_format json escape=json '{"ts":"$time_iso8601","event":"nginx_access","request_id":"$req_id",'
        '"method":"$request_method","uri":"$uri","status":$status,"bytes":$body_bytes_sent,'
        '"duration_ms":$request_time,"upstream":"$upstream_addr","upstream_status":"$upstream_status",'
        '"client_ip":"$remote_addr"}';
    access_log /dev/stdout json;

    server_tokens off;
    client_max_body_size 256k;
    keepalive_timeout 30s;

    upstream api {
        zone api 64k;
        server api:8000 resolve max_fails=3 fail_timeout=10s;
        keepalive 64;
        # Below Uvicorn's 5 s keep-alive: nginx never reuses a socket the replica is closing (a POST
        # already sent on it would not be retried by proxy_next_upstream).
        keepalive_timeout 4s;
    }

    server {
        listen 80;

        # Prometheus scrapes each replica directly; metrics are never public.
        location = /metrics {
            default_type application/problem+json;
            add_header X-Request-ID $req_id always;
            return 404 '{"type":"not-found","title":"Not Found","status":404,"request_id":"$req_id"}';
        }

        location / {
            proxy_pass http://api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Request-ID $req_id;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # A POST retried on another replica is safe: it becomes a 200 duplicate.
            proxy_next_upstream error timeout;
            proxy_next_upstream_tries 2;
            proxy_connect_timeout 2s;
            proxy_read_timeout 30s;
        }

        error_page 413 = @too_large;
        location @too_large {
            default_type application/problem+json;
            add_header X-Request-ID $req_id always;
            return 413 '{"type":"payload-too-large","title":"Payload Too Large","status":413,"detail":"request body exceeds 262144 bytes","request_id":"$req_id"}';
        }

        error_page 504 = @timeout;
        location @timeout {
            default_type application/problem+json;
            add_header X-Request-ID $req_id always;
            add_header Retry-After 1 always;
            return 504 '{"type":"timeout","title":"Gateway Timeout","status":504,"detail":"The replica did not answer in time. The event may or may not be stored; retrying is safe (a stored event answers as a duplicate).","request_id":"$req_id"}';
        }

        error_page 502 503 = @unavailable;
        location @unavailable {
            default_type application/problem+json;
            add_header X-Request-ID $req_id always;
            add_header Retry-After 1 always;
            return 503 '{"type":"unavailable","title":"Service Unavailable","status":503,"detail":"No replica is available; retry later. Retrying is safe.","request_id":"$req_id"}';
        }
    }
}
